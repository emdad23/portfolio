services:
  app:
    image: portfolio-dev
    ports:
      - 3000:3000
    build:
      context: ..
      dockerfile: ./docker-dev/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ..:/app
      - portfolio_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://portfolio:portfolio@postgres:5432/portfolio_dev
      - NEXT_TELEMETRY_DISABLED=1
      # Mail goes to Mailpit in dev — SMTP_HOST being set is what selects the
      # SMTP driver over Resend. Inbox: http://localhost:8025
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SECURE=false
      - MAIL_FROM=portfolio@localhost
      - MAIL_TO=inbox@localhost

  postgres:
    image: postgres:16-alpine
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_dev
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_dev"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Local mail sink. 1025 = SMTP, 8025 = web UI. Ports are published so a
  # host-side `npm run dev` can use SMTP_HOST=localhost and read the same inbox.
  # If you already run Mailpit on the host, either skip this service or shift
  # the published ports with MAILPIT_SMTP_PORT / MAILPIT_UI_PORT.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - ${MAILPIT_SMTP_PORT:-1025}:1025
      - ${MAILPIT_UI_PORT:-8025}:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  portfolio_node_modules:
  portfolio_pgdata:
